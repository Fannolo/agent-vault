name: build-and-test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check toolchain
        run: swift --version
      - name: Resolve pinned dependencies
        run: swift package resolve --force-resolved-versions
      - name: Verify module boundaries
        run: python3 scripts/verify-boundaries.py
      - name: Verify credential reveal boundaries
        run: python3 -I deploy/tests/test_credential_boundaries.py
      - name: Verify credential boundaries with Python assertions disabled
        run: python3 -I -O deploy/tests/test_credential_boundaries.py
      - name: Verify fixture-only boundary guard
        run: python3 -I deploy/tests/test_vault_fixture_boundary.py
      - name: Verify fixture-only guard with Python assertions disabled
        run: python3 -I -O deploy/tests/test_vault_fixture_boundary.py
      - name: Verify membership evidence runner
        run: python3 -I deploy/tests/test_membership_verifier.py
      - name: Verify membership evidence runner with Python assertions disabled
        run: python3 -I -O deploy/tests/test_membership_verifier.py
      - name: Verify scoped secret buffer on macOS
        run: swift test --package-path Packages/VaultSecret --no-parallel
      - name: Build and test pinned dependencies
        run: swift test --force-resolved-versions
      - name: Verify credential public API cannot reveal bytes
        run: python3 -I scripts/verify-credential-api.py
      - name: Verify stdio MCP with synthetic data
        run: python3 scripts/verify-mcp.py
      - name: Verify installer guards without root
        run: python3 scripts/verify-installer.py
      - name: Verify signed release entitlement checks
        run: python3 -I deploy/tests/test_release.py
      - name: Verify cross-process fixture cleanup
        run: python3 -I deploy/tests/test_xpc_cleanup.py
      - name: Verify web host harness process ownership
        run: python3 -I deploy/tests/test_webhost_link_mutations.py
      - name: Verify secret-boundary mutation driver source guard
        run: python3 -I deploy/tests/test_secret_boundary_driver.py
      - name: Verify disabled offline web host preparation
        run: python3 -I deploy/tests/test_webhost_distribution.py
      - name: Verify offline preparation with Python assertions disabled
        run: python3 -I -O deploy/tests/test_webhost_distribution.py
      - name: Verify evidence recorder behavior
        run: python3 -I deploy/tests/test_recorder.py
      - name: Build release executable
        run: swift build -c release --force-resolved-versions
  cloud-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify Linux process ownership and cleanup
        run: python3 -I deploy/tests/test_webhost_link_mutations.py
      - name: Verify opaque cloud transport in a private native PostgreSQL cluster
        run: python3 -I scripts/verify-cloud-transport.py --postgres-bin /usr/lib/postgresql/16/bin
      - name: Retain synthetic database evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cloud-database-evidence
          path: verification-logs/cloud-transport/
          retention-days: 7
          if-no-files-found: warn
  portable-linux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify portable packages in isolated Linux container
        env:
          SWIFT_IMAGE: swift@sha256:d6f8f6112e9a63da0a4a151d6b93acd16699d35c0b82531ac1a245f5af210197
        run: |
          mkdir -p "$RUNNER_TEMP/agent-vault-build"
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --read-only --tmpfs /tmp:rw,exec,nosuid,nodev,mode=1777 \
            --env HOME=/tmp \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/agent-vault-build,dst=/build" \
            --workdir /source "$SWIFT_IMAGE" /bin/bash -euc '
              swift --version
              uname -m
              clang -Wall -Wextra -Werror -pthread -I Sources/CAgentVaultStdio/include \
                Sources/CAgentVaultStdio/CAgentVaultStdio.c deploy/tests/stdio_signal_test.c \
                -o /build/stdio-signal-test
              /build/stdio-signal-test
              swift test --package-path Packages/VaultCore --scratch-path /build/core \
                --force-resolved-versions --no-parallel --jobs 4
              swift test --package-path Packages/VaultSecret --scratch-path /build/secret \
                --no-parallel --jobs 4
              swift test --scratch-path /build/broker \
                --force-resolved-versions --no-parallel --jobs 4
            '

  persistence-macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Resolve exact persistence dependencies
        run: swift package --package-path Packages/VaultPersistence --scratch-path "$RUNNER_TEMP/persistence-build" resolve --force-resolved-versions
      - name: Verify persistence, crash recovery and controls
        run: python3 -I -B Packages/VaultPersistence/Scripts/verify.py --scratch "$RUNNER_TEMP/persistence-build" --evidence verification-logs/persistence-ci/macos --controls
      - name: Retain synthetic persistence evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: persistence-macos-evidence
          path: verification-logs/persistence-ci/macos/
          retention-days: 7
          if-no-files-found: warn
  persistence-linux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned Swift image with system SQLite headers
        run: |
          mkdir -p "$RUNNER_TEMP/persistence-image"
          cat > "$RUNNER_TEMP/persistence-image/Dockerfile" <<'DOCKERFILE'
          FROM swift@sha256:d6f8f6112e9a63da0a4a151d6b93acd16699d35c0b82531ac1a245f5af210197
          RUN apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev python3 && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          docker build -t agent-vault-persistence-ci "$RUNNER_TEMP/persistence-image"
      - name: Verify independent Linux persistence and controls
        run: |
          mkdir -p "$RUNNER_TEMP/persistence-work/checkout/Packages" "$RUNNER_TEMP/persistence-work/checkout/scripts"
          cp -R Packages/VaultPersistence "$RUNNER_TEMP/persistence-work/checkout/Packages/"
          cp scripts/verify-webhost-link-mutations.py "$RUNNER_TEMP/persistence-work/checkout/scripts/"
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --read-only --tmpfs /tmp:rw,exec,nosuid,nodev,mode=1777 \
            --env HOME=/tmp \
            --mount "type=bind,src=$RUNNER_TEMP/persistence-work,dst=/work" \
            --workdir /work/checkout agent-vault-persistence-ci /bin/bash -euc '
              swift package --package-path Packages/VaultPersistence --scratch-path /work/build resolve --force-resolved-versions
              python3 -I -B Packages/VaultPersistence/Scripts/verify.py --scratch /work/build --evidence /work/evidence --controls
            '
      - name: Retain synthetic persistence evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: persistence-linux-evidence
          path: ${{ runner.temp }}/persistence-work/evidence/
          retention-days: 7
          if-no-files-found: warn
